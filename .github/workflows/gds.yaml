name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    # LibreLane leaves these unset, which means single-threaded KLayout. The
    # Tiny Tapeout config disables both KLayout stages (RUN_KLAYOUT_DRC and
    # RUN_KLAYOUT_XOR are 0 in src/config.json), so on this flow they cost
    # nothing, but a runner has 4 cores and a design this size takes long
    # enough in DRC to dominate the job if the stages are ever turned back on.
    # scripts/harden.py computes the same defaults for local runs.
    env:
      KLAYOUT_DRC_THREADS: 4
      KLAYOUT_XOR_THREADS: 4
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp26a
        with:
          pdk: ihp-sg13g2
          librelane-version: 3.0.0.dev44

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp26a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp26a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp26a
